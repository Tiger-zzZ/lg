[project]
name = "lg-a2a-extra"
version = "0.1.0"
description = "Optional A2A demo wrapping supervisor research_agent. Not a production dependency."
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    "starlette>=0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
