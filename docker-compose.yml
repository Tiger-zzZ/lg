services:
  postgres:
    image: postgres:16-alpine
    container_name: lg-postgres
    environment:
      POSTGRES_DB: lg_agent
      POSTGRES_USER: lg_user
      POSTGRES_PASSWORD: lg_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lg_user -d lg_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
